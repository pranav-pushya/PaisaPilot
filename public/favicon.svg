<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Supersonic Jet Gradient (Primary) -->
    <linearGradient id="jetGradMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="80%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wing Highlight & Fold -->
    <linearGradient id="wingHighlight" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Wing Shadow / Lower Facet -->
    <linearGradient id="wingShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Rupee Crossbars (Gold & Mint Glow) -->
    <linearGradient id="rupeeBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Vapor Jetstream Glow -->
    <linearGradient id="vaporTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Core Thrust Flare -->
    <radialGradient id="thrustCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="80%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="jetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>

    <filter id="vaporGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Background -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="124" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.7"/>

  <!-- Subtle Radial Background Bloom -->
  <circle cx="280" cy="230" r="160" fill="url(#thrustCore)" opacity="0.18"/>

  <!-- ======================================================= -->
  <!-- 1. VAPOR THRUST TRAILS (Ascending 45° Trajectory)       -->
  <!-- ======================================================= -->
  <g filter="url(#vaporGlow)">
    <!-- Primary Jetstream -->
    <path d="M 85 415 C 130 375, 175 320, 225 270" stroke="url(#vaporTrail)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <!-- Secondary Streamline -->
    <path d="M 120 435 C 160 395, 205 345, 245 300" stroke="url(#vaporTrail)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <!-- Micro Streamline -->
    <path d="M 140 375 C 180 335, 215 295, 245 255" stroke="url(#vaporTrail)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- ======================================================= -->
  <!-- 2. THE RUPEE JET (Paper Airplane + Indian Rupee ₹)      -->
  <!-- ======================================================= -->
  <g filter="url(#jetGlow)">
    
    <!-- Wing Underbody / Keel Shadow -->
    <path d="M 170 325 L 395 120 L 255 355 Z" fill="url(#wingShadow)" opacity="0.9"/>

    <!-- Left Wing (Lower Fold) -->
    <path d="M 135 275 L 395 120 L 220 295 Z" fill="url(#jetGradMain)"/>

    <!-- Right Wing Main Body (Top Fold forming plane & Rupee arch) -->
    <path d="M 220 295 L 395 120 L 325 350 L 265 295 Z" fill="url(#wingHighlight)"/>

    <!-- Supersonic Nose Cap & Center Spine -->
    <path d="M 220 295 L 395 120 L 265 295 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- ======================================================= -->
    <!-- 3. RUPEE EMBLEM INTEGRATION (Top & Mid Aerodynamic Bars)-->
    <!-- ======================================================= -->
    
    <!-- Top Rupee Wing Bar (Aerodynamic Canard) -->
    <path d="M 145 168 L 330 168 C 342 168, 350 176, 348 188 L 344 204 C 342 214, 332 220, 222 220 L 145 220 C 135 220, 128 212, 130 202 L 134 186 C 136 176, 144 168, 145 168 Z" 
          fill="url(#rupeeBarGrad)"/>

    <!-- Second Rupee Wing Bar (Parallel Stabilizer Bar) -->
    <path d="M 160 236 L 290 236 C 300 236, 308 244, 306 254 L 303 268 C 301 277, 292 284, 282 284 L 160 284 C 150 284, 143 276, 145 266 L 148 252 C 150 242, 158 236, 160 236 Z" 
          fill="url(#rupeeBarGrad)"/>

    <!-- Rupee Downward Diagonal Landing Fin (Leg of the ₹) -->
    <path d="M 245 284 L 350 395 C 358 403, 370 405, 378 397 C 386 389, 384 376, 374 368 L 285 272 Z" 
          fill="url(#wingHighlight)"/>

    <!-- Jet Engine Nozzle / Exhaust Point -->
    <ellipse cx="170" cy="325" rx="9" ry="6" fill="#34D399" transform="rotate(-45 170 325)"/>
    <ellipse cx="170" cy="325" rx="5" ry="3" fill="#FFFFFF" transform="rotate(-45 170 325)"/>

    <!-- AI Pilot Star Sparkle (Apex of Navigation at the Nose) -->
    <g transform="translate(395, 120)">
      <path d="M 0 -18 Q 0 0, 18 0 Q 0 0, 0 18 Q 0 0, -18 0 Q 0 0, 0 -18 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    </g>

    <!-- Micro Navigation Star Sparkle -->
    <g transform="translate(145, 168) scale(0.6)">
      <path d="M 0 -12 Q 0 0, 12 0 Q 0 0, 0 12 Q 0 0, -12 0 Q 0 0, 0 -12 Z" fill="#34D399"/>
    </g>
  </g>
</svg>